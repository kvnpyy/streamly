services:
  streamly:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamly
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist the SQLite database and backups across container restarts.
      - streamly_data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3000

      # ── Required ─────────────────────────────────────────────────────────────
      # Generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET}

      # Encrypts HttpOnly IPTV session cookies. 32+ random chars.
      STREAM_SESSION_SECRET: ${STREAM_SESSION_SECRET}

      # SQLite file inside the mounted volume.
      DATABASE_URL: file:/app/data/stream.db

      # ── Email (required in production for sign-up + password reset) ──────────
      # RESEND_API_KEY: ${RESEND_API_KEY}
      # EMAIL_FROM: "Streamly <noreply@yourdomain.com>"

      # ── Optional ─────────────────────────────────────────────────────────────
      # TMDB free read token — enables programme artwork on channel cards.
      # TMDB_API_TOKEN: ${TMDB_API_TOKEN}

      # Leave unset to disable Google Analytics (recommended for self-hosters).
      # NEXT_PUBLIC_GA_MEASUREMENT_ID: ""

      # Public URL — used for canonical links, Open Graph, and the sitemap.
      # NEXT_PUBLIC_SITE_URL: https://yourdomain.com

      # Separate DB encryption key for saved provider credentials.
      # STREAM_PROVIDER_CREDENTIALS_SECRET: ${STREAM_PROVIDER_CREDENTIALS_SECRET}

volumes:
  streamly_data:
