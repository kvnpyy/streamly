# systemd drop-in: /etc/systemd/system/stream.service.d/override.conf
[Service]
# 8 GiB VPS. Healthy RSS after a restart is ~200 MB. The cap exists so a leak
# is killed and Restart=on-failure brings the site back.
#
# Do NOT set MemoryHigh. Crossing it freezes the process inside
# mem_cgroup_handle_over_high (uninterruptible sleep). systemd still shows
# the service as running, so nothing restarts, and every page times out.
# That is what took iptvwebplayer.org down on 2026-10-06.
MemoryMax=4G
# Keep this cgroup out of swap. The 2G swap file stays available for builds
# and the rest of the OS. Swap-on-the-app-process is what filled the disk
# cache and made the MemoryHigh stall permanent.
MemorySwapMax=0
OOMPolicy=kill
TimeoutStopSec=20
LimitNOFILE=65535
Environment=NODE_OPTIONS=--max-old-space-size=3072
