<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1, user-scalable=no"/>
  <title>Streamly</title>
  <link rel="stylesheet" href="shared/shell.css"/>
</head>
<body>
  <div id="loader" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading Streamly…</p>
  </div>
  <div id="error" hidden>
    <div>
      <h1>Connection problem</h1>
      <p data-error-msg>Could not load Streamly.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </div>
  <iframe
    id="app"
    allow="autoplay; fullscreen; encrypted-media"
    title="Streamly IPTV Player"
  ></iframe>
  <script src="shared/app-shell.js"></script>
</body>
</html>
