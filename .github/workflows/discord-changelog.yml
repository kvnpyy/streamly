# One #changelog note each Friday at noon Eastern.
# Deploys during the week are collected into that single card.
# A quiet week posts nothing.
#
# Friday 16:00 UTC is noon Eastern during daylight time, 11:00 AM in winter.
#
# One-time setup:
#   1. Discord → #changelog → Integrations → Webhooks → New Webhook. Copy the URL.
#   2. GitHub → Settings → Secrets and variables → Actions →
#      New repository secret: DISCORD_CHANGELOG_WEBHOOK = that URL.
#
# A manual run sends the same weekly note early. It does not ping @here
# unless you check "mention_here".

name: Discord changelog

on:
  schedule:
    - cron: "0 16 * * 5"
  workflow_dispatch:
    inputs:
      mention_here:
        description: "Ping @here (leave off)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Post the week's changelog
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          WEEKLY: "true"
          MENTION_HERE: ${{ github.event_name == 'workflow_dispatch' && inputs.mention_here && 'true' || 'false' }}
        run: node scripts/discord-changelog.mjs
